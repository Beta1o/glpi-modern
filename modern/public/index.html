<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GLPI Modern</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>
            <strong>GLPI Modern</strong>
            <small>Service desk</small>
          </span>
        </div>
        <nav class="nav-list">
          <a class="active" href="#dashboard">Dashboard</a>
          <a href="#tickets">Tickets</a>
          <a href="#assets">Assets</a>
          <a href="#operations">Operations</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1>Operations Overview</h1>
            <p id="systemStatus">Checking service status</p>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </header>

        <section class="metric-grid" id="metrics" aria-label="Metrics"></section>

        <section class="split-layout">
          <div class="panel" id="tickets">
            <div class="panel-heading">
              <h2>Tickets</h2>
              <span id="ticketCount"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Number</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="ticketRows"></tbody>
              </table>
            </div>
          </div>

          <form class="panel form-panel" id="ticketForm">
            <div class="panel-heading">
              <h2>New Ticket</h2>
            </div>
            <label>
              Title
              <input name="title" autocomplete="off" minlength="4" maxlength="160" required>
            </label>
            <label>
              Requester
              <input name="requester" autocomplete="off" minlength="2" maxlength="80" required>
            </label>
            <label>
              Priority
              <select name="priority">
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
                <option value="low">Low</option>
              </select>
            </label>
            <label>
              Asset
              <select name="assetId" id="assetSelect">
                <option value="">Unassigned</option>
              </select>
            </label>
            <button type="submit">Create Ticket</button>
            <p class="form-message" id="formMessage" role="status"></p>
          </form>
        </section>

        <section class="panel" id="assets">
          <div class="panel-heading">
            <h2>Assets</h2>
            <span id="assetCount"></span>
          </div>
          <div class="asset-grid" id="assetGrid"></div>
        </section>
      </main>
    </div>
  </body>
</html>
