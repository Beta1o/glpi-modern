<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GLPI Modern</title>
    <link rel="stylesheet" href="/legacy/lib/base.css">
    <link rel="stylesheet" href="/legacy/lib/tabler.css">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span>
            <strong>GLPI</strong>
            <small>Technology migration</small>
          </span>
        </div>
        <nav class="nav-list">
          <a class="active" href="/front/central.php">Dashboard</a>
          <a href="/front/ticket.php">Tickets</a>
          <a href="/front/ticket.form.php">Create Ticket</a>
          <a href="/front/computer.php">Computers</a>
          <a href="/front/user.php">Users</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1>Standard Interface</h1>
            <p id="systemStatus">Checking service status</p>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </header>

        <section class="metric-grid" id="metrics" aria-label="Metrics"></section>

        <section class="split-layout">
          <div class="panel" id="tickets">
            <div class="panel-heading">
              <h2>Tickets</h2>
              <span id="ticketCount"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Number</th>
                    <th>Title</th>
                    <th>Requester</th>
                    <th>Type</th>
                    <th>Priority</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="ticketRows"></tbody>
              </table>
            </div>
          </div>

          <form class="panel form-panel" id="ticketForm">
            <div class="panel-heading">
              <h2>Create Ticket</h2>
            </div>
            <label>
              Title
              <input name="title" autocomplete="off" minlength="4" maxlength="160" required>
            </label>
            <label>
              Requester
              <select name="requesterId" id="requesterSelect" required>
                <option value="">Select requester</option>
              </select>
            </label>
            <label>
              Type
              <select name="type">
                <option value="1">Incident</option>
                <option value="2">Request</option>
              </select>
            </label>
            <label>
              Priority
              <select name="priority">
                <option value="3">Medium</option>
                <option value="4">High</option>
                <option value="5">Very high</option>
                <option value="6">Major</option>
                <option value="2">Low</option>
                <option value="1">Very low</option>
              </select>
            </label>
            <label>
              Asset
              <select name="assetId" id="assetSelect">
                <option value="">Unassigned</option>
              </select>
            </label>
            <label>
              Content
              <textarea name="content" maxlength="65000" rows="4"></textarea>
            </label>
            <button type="submit">Create Ticket</button>
            <p class="form-message" id="formMessage" role="status"></p>
          </form>
        </section>

        <section class="panel" id="assets">
          <div class="panel-heading">
            <h2>Computers / Assets</h2>
            <span id="assetCount"></span>
          </div>
          <div class="asset-grid" id="assetGrid"></div>
        </section>
      </main>
    </div>
  </body>
</html>
